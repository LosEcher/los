name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

# node34 reaches the npm registry over an unstable path (IPv6 unreachable +
# intermittent IPv4 timeouts, observed 2026-08-03). Force IPv4-first DNS so
# Node/pnpm do not burn the connect budget on ENETUNREACH v6 attempts.
defaults:
  run:
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first

# Primary CI workflow. Pull requests run three required jobs plus Web E2E on
# the Windows Podman runner. Manual dispatch provides unchanged-head canaries.
# Keeping all four context names stable avoids a simultaneous branch-protection
# migration while node34 is reduced to Forgejo-only archival service.
jobs:
  gate-fast:
    runs-on: win-ci-jj
    timeout-minutes: 15
    env:
      # Parallel turbo typecheck: CI has no turbo cache, so serial (1) cost
      # ~100s of the ~2.4m gate-fast. 4x matches github's parallel jobs and
      # the runner's observed capacity (two concurrent jobs ran undegraded).
      TURBO_CONCURRENCY: 4
      # Turbo cache persisted on the runner host like the pnpm store
      # (~/.local/share/pnpm/store, persisted since run 137). Turbo content-
      # hashes cache entries, so a warm directory speeds up typecheck/checks
      # across commits without an actions/cache server dependency. Verify on
      # the next real PR: gate-fast should drop toward ~2m with warm cache.
      TURBO_CACHE_DIR: /root/.local/share/turbo
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          auth_url="${FORGEJO_SERVER_URL#http://}"
          git init .
          git remote add origin "http://x-access-token:${FORGEJO_TOKEN}@${auth_url}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Forgejo runner requires Node 22+')"
          corepack enable
          # npm-registry path is jittery (2026-08-03: IPv6 unreachable +
          # intermittent IPv4 timeouts); retry the corepack pnpm fetch instead
          # of failing the job on one timeout.
          for attempt in 1 2 3 4 5; do
            if pnpm --version >/dev/null 2>&1; then break; fi
            echo "corepack pnpm fetch attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          test "$(pnpm --version)" = "11.6.0"
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Observe pnpm store capacity
        run: ./tools/observe-pnpm-store.sh --json

      - name: Fast gate (no DB, no tests)
        run: pnpm run gate -- --no-tests

      # ci-gate.sh writes phase timings to /tmp/los-gate-summary.json; the
      # Forgejo job-log API returns stale bodies (2026-08-09 PR #256), so echo
      # the summary into the step log as a self-reported observability channel.
      - name: Emit gate summary (gate-fast)
        if: always()
        run: |
          set -euo pipefail
          if [ -f /tmp/los-gate-summary.json ]; then
            echo "===== los gate-fast phase timing summary ====="
            cat /tmp/los-gate-summary.json
            echo "===== end gate summary ====="
          else
            echo "no /tmp/los-gate-summary.json produced"
          fi

  gate-test:
    if: forgejo.event_name != 'push'
    # No `needs: gate-fast`: each job does its own checkout+install, and the
    # runner sustains concurrent jobs (observed: two gate-fast jobs overlapped
    # at full speed). Parallelizing cuts run wall time from gate-fast+gate-test
    # (~5.2m) to max(gate-fast, gate-test) (~2.8m), matching github's layout.
    runs-on: win-ci-jj
    timeout-minutes: 40

    services:
      postgres-test:
        image: postgres:16
        env:
          POSTGRES_USER: los_ci_test
          POSTGRES_PASSWORD: los-ci-test-only
          POSTGRES_DB: los_ci_test
          POSTGRES_HOST_AUTH_METHOD: md5

    env:
      DATABASE_URL: postgres://los_ci_test:los-ci-test-only@postgres-test:5432/los_ci_test
      TEST_DATABASE_URL: postgres://los_ci_test:los-ci-test-only@postgres-test:5432/los_ci_test
      NODE_ENV: test
      LOS_TEST_CONCURRENCY: 2
      # Turbo cache persisted on the runner host (same family as the pnpm
      # store dir). Warm cache shortens the non-DB turbo work inside the test
      # phases across commits.
      TURBO_CACHE_DIR: /root/.local/share/turbo

    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          auth_url="${FORGEJO_SERVER_URL#http://}"
          git init .
          git remote add origin "http://x-access-token:${FORGEJO_TOKEN}@${auth_url}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Forgejo runner requires Node 22+')"
          corepack enable
          # npm-registry path is jittery (2026-08-03: IPv6 unreachable +
          # intermittent IPv4 timeouts); retry the corepack pnpm fetch instead
          # of failing the job on one timeout.
          for attempt in 1 2 3 4 5; do
            if pnpm --version >/dev/null 2>&1; then break; fi
            echo "corepack pnpm fetch attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          test "$(pnpm --version)" = "11.6.0"
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Verify jj runtime
        run: jj --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Test agent (3 groups parallel)
        id: test-agent
        run: |
          set -o pipefail
          AGENT_T0=$(date +%s)
          mkdir -p /tmp/los-ci-logs
          echo "=== agent group 1/3 ===" && LOS_TEST_GROUP=1 pnpm --filter @los/agent test 2>&1 | tee /tmp/los-ci-logs/agent-g1.log | bash tools/check-known-failures.sh --allow-fixed &
          PID1=$!
          echo "=== agent group 2/3 ===" && LOS_TEST_GROUP=2 pnpm --filter @los/agent test 2>&1 | tee /tmp/los-ci-logs/agent-g2.log | bash tools/check-known-failures.sh --allow-fixed &
          PID2=$!
          echo "=== agent group 3/3 ===" && LOS_TEST_GROUP=3 pnpm --filter @los/agent test 2>&1 | tee /tmp/los-ci-logs/agent-g3.log | bash tools/check-known-failures.sh --allow-fixed &
          PID3=$!
          wait $PID1; S1=$?
          wait $PID2; S2=$?
          wait $PID3; S3=$?
          AGENT_T1=$(date +%s)
          echo "agent-groups elapsed_sec=$((AGENT_T1 - AGENT_T0))" | tee -a /tmp/los-ci-logs/timings.txt
          [ $S1 -eq 0 ] && [ $S2 -eq 0 ] && [ $S3 -eq 0 ]
        timeout-minutes: 12

      - name: Test other packages
        id: test-packages
        run: |
          set -o pipefail
          PKG_T0=$(date +%s)
          mkdir -p /tmp/los-ci-logs
          pnpm --filter '@los/*' --filter '!@los/agent' test 2>&1 | tee /tmp/los-ci-logs/packages.log | bash tools/check-known-failures.sh --allow-fixed
          PKG_T1=$(date +%s)
          echo "packages elapsed_sec=$((PKG_T1 - PKG_T0))" | tee -a /tmp/los-ci-logs/timings.txt
        timeout-minutes: 10

      - name: Enforce critical module coverage
        id: test-coverage
        run: |
          CVG_T0=$(date +%s)
          pnpm test:coverage:critical
          CVG_T1=$(date +%s)
          echo "coverage elapsed_sec=$((CVG_T1 - CVG_T0))" | tee -a /tmp/los-ci-logs/timings.txt
        timeout-minutes: 8

      - name: Emit test timings summary (gate-test)
        if: always()
        run: |
          set -euo pipefail
          echo "===== los gate-test step timings ====="
          if [ -f /tmp/los-ci-logs/timings.txt ]; then
            cat /tmp/los-ci-logs/timings.txt
          else
            echo "no /tmp/los-ci-logs/timings.txt captured"
          fi
          echo "===== end timings ====="

      # Forgejo job-log API often returns stale/wrong task bodies (observed 2026-08-09
      # on PR #256). Emit an explicit tail into the step log so commit-status
      # "Failing after XmYs" can still be diagnosed without the UI log map.
      - name: Emit failure tail (gate-test)
        if: failure()
        run: |
          set -euo pipefail
          echo "===== los CI failure tail (gate-test) sha=${FORGEJO_SHA:-unknown} ====="
          for f in /tmp/los-ci-logs/agent-g1.log /tmp/los-ci-logs/agent-g2.log /tmp/los-ci-logs/agent-g3.log /tmp/los-ci-logs/packages.log; do
            if [ -f "$f" ]; then
              echo "----- $(basename "$f") tail -----"
              tail -n 60 "$f" || true
            fi
          done
          echo "===== end failure tail ====="

  gate-web-e2e:
    if: forgejo.event_name != 'push'
    # Same rationale as gate-test: no needs on gate-fast; each job checks out
    # its own tree and the runner pool handles concurrency.
    runs-on: win-ci-playwright
    timeout-minutes: 10

    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          auth_url="${FORGEJO_SERVER_URL#http://}"
          git init .
          git remote add origin "http://x-access-token:${FORGEJO_TOKEN}@${auth_url}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Forgejo runner requires Node 22+')"
          corepack enable
          # npm-registry path is jittery (2026-08-03: IPv6 unreachable +
          # intermittent IPv4 timeouts); retry the corepack pnpm fetch instead
          # of failing the job on one timeout.
          for attempt in 1 2 3 4 5; do
            if pnpm --version >/dev/null 2>&1; then break; fi
            echo "corepack pnpm fetch attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          test "$(pnpm --version)" = "11.6.0"
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Test Web operator paths
        id: web-e2e
        run: |
          set -o pipefail
          mkdir -p /tmp/los-ci-logs
          pnpm --filter @los/web test:e2e 2>&1 | tee /tmp/los-ci-logs/web-e2e.log

      - name: Emit failure tail (gate-web-e2e)
        if: failure()
        run: |
          set -euo pipefail
          echo "===== los CI failure tail (gate-web-e2e) sha=${FORGEJO_SHA:-unknown} ====="
          if [ -f /tmp/los-ci-logs/web-e2e.log ]; then
            # Prefer failed-spec lines, then last 80 lines of the full log.
            grep -nE '✘|Error:|failed$|Timeout|not found|expect\(' /tmp/los-ci-logs/web-e2e.log | tail -n 40 || true
            echo "----- web-e2e.log tail -----"
            tail -n 80 /tmp/los-ci-logs/web-e2e.log || true
          else
            echo "no /tmp/los-ci-logs/web-e2e.log captured"
          fi
          echo "===== end failure tail ====="

  gate-drift:
    if: forgejo.event_name != 'push'
    runs-on: win-ci
    timeout-minutes: 10

    services:
      postgres-drift:
        image: postgres:16
        env:
          POSTGRES_USER: los_ci_drift
          POSTGRES_PASSWORD: los-ci-drift-only
          POSTGRES_DB: los_ci_drift
          POSTGRES_HOST_AUTH_METHOD: md5

    # DATABASE_URL is the server URL check-migration-drift uses to CREATE
    # the ephemeral los_drift_mig / los_drift_ensure databases.
    env:
      DATABASE_URL: postgres://los_ci_drift:los-ci-drift-only@postgres-drift:5432/los_ci_drift

    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          auth_url="${FORGEJO_SERVER_URL#http://}"
          git init .
          git remote add origin "http://x-access-token:${FORGEJO_TOKEN}@${auth_url}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Forgejo runner requires Node 22+')"
          corepack enable
          # npm-registry path is jittery (2026-08-03); retry the corepack
          # pnpm fetch instead of failing the job on one timeout.
          for attempt in 1 2 3 4 5; do
            if pnpm --version >/dev/null 2>&1; then break; fi
            echo "corepack pnpm fetch attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          test "$(pnpm --version)" = "11.6.0"
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Migration-drift gate. Unset NODE_ENV/TEST_DATABASE_URL so initDb's test
      # guard does not redirect the gate's explicit drift-DB URLs to los_test
      # (would make the gate compare a DB against itself, always green).
      - name: Migration drift
        run: pnpm check:migration-drift
        env:
          NODE_ENV: ''
          TEST_DATABASE_URL: ''
