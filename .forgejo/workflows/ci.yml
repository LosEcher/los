name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

# Primary CI workflow. Pull requests run three required jobs plus Web E2E on
# the Windows Podman runner. Manual dispatch provides unchanged-head canaries.
# Keeping all four context names stable avoids a simultaneous branch-protection
# migration while node34 is reduced to Forgejo-only archival service.
jobs:
  gate-fast:
    runs-on: win-ci-jj
    timeout-minutes: 15
    env:
      TURBO_CONCURRENCY: 1
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          auth_url="${FORGEJO_SERVER_URL#http://}"
          git init .
          git remote add origin "http://x-access-token:${FORGEJO_TOKEN}@${auth_url}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Forgejo runner requires Node 22+')"
          corepack enable
          test "$(pnpm --version)" = "9.0.0"
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Observe pnpm store capacity
        run: ./tools/observe-pnpm-store.sh --json

      - name: Fast gate (no DB, no tests)
        run: pnpm run gate -- --no-tests

  gate-test:
    if: forgejo.event_name != 'push'
    needs: gate-fast
    runs-on: win-ci-jj
    timeout-minutes: 40

    services:
      postgres-test:
        image: postgres:16
        env:
          POSTGRES_USER: los_ci_test
          POSTGRES_PASSWORD: los-ci-test-only
          POSTGRES_DB: los_ci_test
          POSTGRES_HOST_AUTH_METHOD: md5
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    env:
      DATABASE_URL: postgres://los_ci_test:los-ci-test-only@postgres-test:5432/los_ci_test
      TEST_DATABASE_URL: postgres://los_ci_test:los-ci-test-only@postgres-test:5432/los_ci_test
      NODE_ENV: test
      LOS_TEST_CONCURRENCY: 2

    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          auth_url="${FORGEJO_SERVER_URL#http://}"
          git init .
          git remote add origin "http://x-access-token:${FORGEJO_TOKEN}@${auth_url}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Forgejo runner requires Node 22+')"
          corepack enable
          test "$(pnpm --version)" = "9.0.0"
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Verify jj runtime
        run: jj --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Test agent (3 groups parallel)
        run: |
          echo "=== agent group 1/3 ===" && LOS_TEST_GROUP=1 pnpm --filter @los/agent test &
          PID1=$!
          echo "=== agent group 2/3 ===" && LOS_TEST_GROUP=2 pnpm --filter @los/agent test &
          PID2=$!
          echo "=== agent group 3/3 ===" && LOS_TEST_GROUP=3 pnpm --filter @los/agent test &
          PID3=$!
          wait $PID1; S1=$?
          wait $PID2; S2=$?
          wait $PID3; S3=$?
          [ $S1 -eq 0 ] && [ $S2 -eq 0 ] && [ $S3 -eq 0 ]
        timeout-minutes: 12

      - name: Test other packages
        run: pnpm --filter '@los/*' --filter '!@los/agent' test
        timeout-minutes: 10

      - name: Enforce critical module coverage
        run: pnpm test:coverage:critical
        timeout-minutes: 8

  gate-web-e2e:
    if: forgejo.event_name != 'push'
    needs: gate-fast
    runs-on: win-ci-playwright
    timeout-minutes: 10

    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          auth_url="${FORGEJO_SERVER_URL#http://}"
          git init .
          git remote add origin "http://x-access-token:${FORGEJO_TOKEN}@${auth_url}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Forgejo runner requires Node 22+')"
          corepack enable
          test "$(pnpm --version)" = "9.0.0"
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Test Web operator paths
        run: pnpm --filter @los/web test:e2e

  gate-drift:
    if: forgejo.event_name != 'push'
    runs-on: win-ci
    timeout-minutes: 10

    services:
      postgres-drift:
        image: postgres:16
        env:
          POSTGRES_USER: los_ci_drift
          POSTGRES_PASSWORD: los-ci-drift-only
          POSTGRES_DB: los_ci_drift
          POSTGRES_HOST_AUTH_METHOD: md5
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    # DATABASE_URL is the server URL check-migration-drift uses to CREATE
    # the ephemeral los_drift_mig / los_drift_ensure databases.
    env:
      DATABASE_URL: postgres://los_ci_drift:los-ci-drift-only@postgres-drift:5432/los_ci_drift

    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          auth_url="${FORGEJO_SERVER_URL#http://}"
          git init .
          git remote add origin "http://x-access-token:${FORGEJO_TOKEN}@${auth_url}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Forgejo runner requires Node 22+')"
          corepack enable
          test "$(pnpm --version)" = "9.0.0"
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Migration-drift gate. Unset NODE_ENV/TEST_DATABASE_URL so initDb's test
      # guard does not redirect the gate's explicit drift-DB URLs to los_test
      # (would make the gate compare a DB against itself, always green).
      - name: Migration drift
        run: pnpm check:migration-drift
        env:
          NODE_ENV: ''
          TEST_DATABASE_URL: ''
