name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

# node34 reaches the npm registry over an unstable path (IPv6 unreachable +
# intermittent IPv4 timeouts, observed 2026-08-03). Force IPv4-first DNS so
# Node/pnpm do not burn the connect budget on ENETUNREACH v6 attempts.
defaults:
  run:
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first

# Primary CI workflow. Pull requests run three required jobs plus Web E2E on
# the Windows Podman runner. Manual dispatch provides unchanged-head canaries.
# Keeping all four context names stable avoids a simultaneous branch-protection
# migration while node34 is reduced to Forgejo-only archival service.
jobs:
  gate-fast:
    runs-on: win-ci-jj
    timeout-minutes: 15
    env:
      # Parallel turbo typecheck: CI has no turbo cache, so serial (1) cost
      # ~100s of the ~2.4m gate-fast. 4x matches github's parallel jobs and
      # the runner's observed capacity (two concurrent jobs ran undegraded).
      TURBO_CONCURRENCY: 4
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          auth_url="${FORGEJO_SERVER_URL#http://}"
          git init .
          git remote add origin "http://x-access-token:${FORGEJO_TOKEN}@${auth_url}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Forgejo runner requires Node 22+')"
          corepack enable
          # npm-registry path is jittery (2026-08-03: IPv6 unreachable +
          # intermittent IPv4 timeouts); retry the corepack pnpm fetch instead
          # of failing the job on one timeout.
          for attempt in 1 2 3 4 5; do
            if pnpm --version >/dev/null 2>&1; then break; fi
            echo "corepack pnpm fetch attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          test "$(pnpm --version)" = "11.6.0"
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Observe pnpm store capacity
        run: ./tools/observe-pnpm-store.sh --json

      - name: Fast gate (no DB, no tests)
        run: pnpm run gate -- --no-tests

  gate-test:
    if: forgejo.event_name != 'push'
    # No `needs: gate-fast`: each job does its own checkout+install, and the
    # runner sustains concurrent jobs (observed: two gate-fast jobs overlapped
    # at full speed). Parallelizing cuts run wall time from gate-fast+gate-test
    # (~5.2m) to max(gate-fast, gate-test) (~2.8m), matching github's layout.
    runs-on: win-ci-jj
    timeout-minutes: 40

    services:
      postgres-test:
        image: postgres:16
        env:
          POSTGRES_USER: los_ci_test
          POSTGRES_PASSWORD: los-ci-test-only
          POSTGRES_DB: los_ci_test
          POSTGRES_HOST_AUTH_METHOD: md5
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    env:
      DATABASE_URL: postgres://los_ci_test:los-ci-test-only@postgres-test:5432/los_ci_test
      TEST_DATABASE_URL: postgres://los_ci_test:los-ci-test-only@postgres-test:5432/los_ci_test
      NODE_ENV: test
      LOS_TEST_CONCURRENCY: 2

    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          auth_url="${FORGEJO_SERVER_URL#http://}"
          git init .
          git remote add origin "http://x-access-token:${FORGEJO_TOKEN}@${auth_url}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Forgejo runner requires Node 22+')"
          corepack enable
          # npm-registry path is jittery (2026-08-03: IPv6 unreachable +
          # intermittent IPv4 timeouts); retry the corepack pnpm fetch instead
          # of failing the job on one timeout.
          for attempt in 1 2 3 4 5; do
            if pnpm --version >/dev/null 2>&1; then break; fi
            echo "corepack pnpm fetch attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          test "$(pnpm --version)" = "11.6.0"
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Verify jj runtime
        run: jj --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Test agent (3 groups parallel)
        run: |
          set -o pipefail
          echo "=== agent group 1/3 ===" && LOS_TEST_GROUP=1 pnpm --filter @los/agent test 2>&1 | bash tools/check-known-failures.sh --allow-fixed &
          PID1=$!
          echo "=== agent group 2/3 ===" && LOS_TEST_GROUP=2 pnpm --filter @los/agent test 2>&1 | bash tools/check-known-failures.sh --allow-fixed &
          PID2=$!
          echo "=== agent group 3/3 ===" && LOS_TEST_GROUP=3 pnpm --filter @los/agent test 2>&1 | bash tools/check-known-failures.sh --allow-fixed &
          PID3=$!
          wait $PID1; S1=$?
          wait $PID2; S2=$?
          wait $PID3; S3=$?
          [ $S1 -eq 0 ] && [ $S2 -eq 0 ] && [ $S3 -eq 0 ]
        timeout-minutes: 12

      - name: Test other packages
        run: set -o pipefail; pnpm --filter '@los/*' --filter '!@los/agent' test 2>&1 | bash tools/check-known-failures.sh --allow-fixed
        timeout-minutes: 10

      - name: Enforce critical module coverage
        run: pnpm test:coverage:critical
        timeout-minutes: 8

  gate-web-e2e:
    if: forgejo.event_name != 'push'
    # Same rationale as gate-test: no needs on gate-fast; each job checks out
    # its own tree and the runner pool handles concurrency.
    runs-on: win-ci-playwright
    timeout-minutes: 10

    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          auth_url="${FORGEJO_SERVER_URL#http://}"
          git init .
          git remote add origin "http://x-access-token:${FORGEJO_TOKEN}@${auth_url}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Forgejo runner requires Node 22+')"
          corepack enable
          # npm-registry path is jittery (2026-08-03: IPv6 unreachable +
          # intermittent IPv4 timeouts); retry the corepack pnpm fetch instead
          # of failing the job on one timeout.
          for attempt in 1 2 3 4 5; do
            if pnpm --version >/dev/null 2>&1; then break; fi
            echo "corepack pnpm fetch attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          test "$(pnpm --version)" = "11.6.0"
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Test Web operator paths
        run: pnpm --filter @los/web test:e2e

  gate-drift:
    if: forgejo.event_name != 'push'
    runs-on: win-ci
    timeout-minutes: 10

    services:
      postgres-drift:
        image: postgres:16
        env:
          POSTGRES_USER: los_ci_drift
          POSTGRES_PASSWORD: los-ci-drift-only
          POSTGRES_DB: los_ci_drift
          POSTGRES_HOST_AUTH_METHOD: md5
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    # DATABASE_URL is the server URL check-migration-drift uses to CREATE
    # the ephemeral los_drift_mig / los_drift_ensure databases.
    env:
      DATABASE_URL: postgres://los_ci_drift:los-ci-drift-only@postgres-drift:5432/los_ci_drift

    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          auth_url="${FORGEJO_SERVER_URL#http://}"
          git init .
          git remote add origin "http://x-access-token:${FORGEJO_TOKEN}@${auth_url}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"

      - name: Prepare pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Forgejo runner requires Node 22+')"
          corepack enable
          # npm-registry path is jittery (2026-08-03); retry the corepack
          # pnpm fetch instead of failing the job on one timeout.
          for attempt in 1 2 3 4 5; do
            if pnpm --version >/dev/null 2>&1; then break; fi
            echo "corepack pnpm fetch attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          test "$(pnpm --version)" = "11.6.0"
          pnpm config set store-dir ~/.local/share/pnpm/store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Migration-drift gate. Unset NODE_ENV/TEST_DATABASE_URL so initDb's test
      # guard does not redirect the gate's explicit drift-DB URLs to los_test
      # (would make the gate compare a DB against itself, always green).
      - name: Migration drift
        run: pnpm check:migration-drift
        env:
          NODE_ENV: ''
          TEST_DATABASE_URL: ''
