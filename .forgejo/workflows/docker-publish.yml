name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.build.yml'
      - 'docker-entrypoint.sh'
      - 'docker-bake.hcl'
      - '.dockerignore'
      - '.env.docker'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'packages/*/package.json'
      - 'packages/web/**'
      - 'packages/gateway/**'
      - 'contracts/**'
      - '.forgejo/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'

concurrency:
  group: docker-publish-${{ forgejo.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Requires a runner with Docker + buildx available.
    # For Podman-based runners, set DOCKER_HOST or use podman-docker.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Keep image path aligned with Dockerfile / docker-compose.yml.
          # Do not use github.repository: Forgejo path is los/los while the
          # published GHCR name is los-ecommerce/los.
          images: ghcr.io/los-ecommerce/los
          tags: |
            type=raw,value=${{ inputs.tag || 'latest' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
