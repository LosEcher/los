contract: los.metrics-trends
version: 0.1.0
status: implemented
owner: packages/agent
description: >
  Per-day provider/model call telemetry series with window-over-window
  comparison (current window vs the preceding window of equal length).
  Aggregates provider_call_telemetry only; no external CLI fleets.
type: object
routes:
  - method: GET
    path: /metrics/trends
    purpose: Return daily latency/error/call series per provider x model plus
      a compare block (calls, error rate, avg latency delta vs previous window).
    query:
      from: optional ISO timestamp inclusive lower bound; default now-14d
      to: optional ISO timestamp exclusive upper bound; default now
      provider: optional exact provider filter
      model: optional exact model filter
    response: MetricsTrends
schemas:
  MetricsTrends:
    required: [evidenceClass, from, to, series]
    evidenceClass:
      enum: [los_runtime]
    series:
      itemFields:
        - provider
        - model
        - points
        - compare
    points:
      itemFields:
        - day
        - callCount
        - errorCount
        - errorRate
        - avgDurationMs
        - p50DurationMs
        - p95DurationMs
        - usageFillRate
    compare:
      fields:
        - currentCalls
        - previousCalls
        - callsDeltaPct
        - currentErrorRate
        - previousErrorRate
        - errorRateDeltaPct
        - currentAvgMs
        - previousAvgMs
        - avgMsDeltaPct
