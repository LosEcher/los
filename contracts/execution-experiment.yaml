contract: los.execution-experiment
version: 0.2.0
status: implemented
owner: packages/agent
description: >
  Immutable provenance and explicit lifecycle for a single-candidate execution
  experiment derived from a persisted source run.
type: object
schemaDialect: https://json-schema.org/draft/2020-12/schema
required: [id, source, configDiff, status, createdBy]
properties:
  id: { type: string, minLength: 1 }
  tenantId: { type: string }
  projectId: { type: string }
  source:
    type: object
    required: [sessionId, runSpecId, eventCursor, evidenceHash]
    additionalProperties: false
    properties:
      sessionId: { type: string, minLength: 1 }
      runSpecId: { type: string, minLength: 1 }
      eventCursor: { type: integer, minimum: 0 }
      evidenceHash: { type: string, minLength: 1 }
      fingerprint:
        type: object
        additionalProperties: false
        properties:
          prompt: { type: string }
          spec: { type: string }
          memory: { type: string }
          toolCatalog: { type: string }
  configDiff:
    type: array
    items:
      type: object
      required: [path, value]
      additionalProperties: false
      properties:
        path: { type: string, minLength: 1 }
        value: {}
        inherited: { type: boolean }
  candidateRunSpecId: { type: string }
  status:
    type: string
    enum: [draft, approved, running, succeeded, failed, cancelled, blocked]
  createdBy: { type: string, minLength: 1 }
  approvedBy: { type: string }
  createdAt: { type: string, format: date-time }
  updatedAt: { type: string, format: date-time }
routes:
  - method: POST
    path: /execution-experiments
    idempotencyHeader: x-idempotency-key
    scope: request tenant and project
  - method: GET
    path: /execution-experiments/{id}
    scope: request tenant and project
  - method: POST
    path: /execution-experiments/{id}/approve
    auth: operator
    scope: request tenant and project
  - method: POST
    path: /execution-experiments/{id}/select-candidate
    auth: operator
    scope: request tenant and project
  - method: POST
    path: /execution-experiments/{id}/authorize-canary
    auth: operator
    scope: request tenant and project
    confirmation: candidate run-spec id
  - method: POST
    path: /execution-experiments/{id}/rollback
    auth: operator
    scope: request tenant and project
  - method: POST
    path: /execution-experiments/{id}/execute
    auth: operator
    scope: request tenant and project
candidateBudget:
  inheritedFields: [maxLoops, timeoutMs, toolMode, allowedTools]
  overrideRule: every override must appear in configDiff and pass the run-spec contract
  numericRule: maxLoops and timeoutMs must be positive integers
operatorControl:
  authentication:
    header: x-los-operator-token
    behaviorWhenAuthDisabled: local_operator
  requiredFor: [approve, select-candidate, authorize-canary, rollback, execute]
  actorSource: request context user id
# K4 kernel experiments are the first concrete candidate family. Non-kernel
# experiments (provider/model/toolMode/allowedTools/maxLoops/timeoutMs/
# modelSettings diffs) are also selectable through the same lifecycle; they
# create a plain candidate run spec with no executionKernel selection and no
# canary authorization.
kernelCandidate:
  configDiffPath: executionKernel
  exactCandidate:
    kind: pi
    version: 0.81.1+los.3
    protocolVersion: 0.1.0
  dispositions: [planning, inspection]
  requiredToolMode: read-only
  requiredRunContractMode: audit
  defaultKernelUnchanged: los
  remoteExecutorAllowed: false
  canaryAuthorization:
    initial: not_granted
    explicitOperatorActionRequired: true
    executeRequiresGranted: true
  rollback:
    target:
      kind: los
      version: 0.1.0
      protocolVersion: 0.1.0
    revokesCanaryAuthorization: true
nonKernelCandidate:
  allowedDiffPaths: [provider, model, toolMode, allowedTools, maxLoops, timeoutMs, modelSettings]
  toolModes: [all, project-write, read-only]
  runContractMode: audit
  executionKernel: omitted
  canaryAuthorization: not_applicable
  remoteExecutorAllowed: true
invariants:
  - Draft creation never schedules or executes a candidate.
  - Source session, run, cursor, evidence hash, and fingerprints are immutable provenance references.
  - A K4 candidate run spec is persisted before experiment approval or execution and keeps the source plan lineage.
  - Pi selection is valid only for the exact K4 candidate, an audit RunContract, and read-only planning or inspection.
  - Selecting Pi never changes the default LOS registry decision and never enables a remote executor.
  - Non-kernel candidates apply the configDiff onto the source run spec, keep the source plan lineage, and carry no executionKernel selection.
  - Non-kernel candidate execution requires operator approval and a plan_approved phase, and may use the configured executor mesh.
  - Experiment approval and candidate plan approval do not grant provider-canary consent.
  - Rollback selects the exact LOS adapter on the same run spec, records actor and reason, and revokes canary authorization.
  - Candidate run plans are persisted in planning and approved through approveRunSpecPhase before execution.
  - Candidate success remains gated by canMarkSucceeded and persisted verification records.
  - An idempotent create retry replays the original response without creating another experiment.
