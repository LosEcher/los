contract: los.skill-mcp-distribution
version: 0.3.0
status: implemented
owner: packages/agent
description: >
  Auditable distribution lifecycle for file-backed skills and persistent MCP
  server registrations. Sources and content-derived versions are inspectable
  before apply, updates retain rollback history, pins prevent unreviewed drift,
  and MCP authentication remains separate from per-tool execution policy.
type: object
routes:
  skills:
    - method: POST
      path: /skills/import/inspect
      behavior: read files and compare versions without writing PostgreSQL
    - method: POST
      path: /skills/import/apply
      behavior: apply only the exact name/version pairs returned by inspect
    - method: GET
      path: /skills/:name/history
    - method: POST
      path: /skills/:name/pin
    - method: POST
      path: /skills/:name/rollback
  mcpServers:
    - method: POST
      path: /mcp-servers/inspect
      behavior: normalize and hash a registration without writing PostgreSQL or starting a process
    - method: POST
      path: /mcp-servers
      behavior: apply only when inspectedVersionHash matches the normalized registration
    - method: GET
      path: /mcp-servers/:id/history
    - method: POST
      path: /mcp-servers/:id/pin
    - method: POST
      path: /mcp-servers/:id/rollback
    - method: POST
      path: /mcp-servers/:id/verify
      behavior: >
        resolve credential_ref when present, build full MCPServerConfig
        (stdio command/args/env or remote url/transport/headers), connect,
        discover tools; responses never include raw secrets
versioning:
  algorithm: sha256
  encoding: lowercase hexadecimal
  skills: hash canonical source path, metadata, and content
  mcpServers: hash normalized transport, connection metadata, auth config, and tool policy
  history: immutable snapshots keyed by scoped entity id and version hash
  pinBehavior: an update whose version differs from pinnedVersionHash is rejected with 409
skillImport:
  inspectActions:
    - create
    - update
    - unchanged
  applyPrecondition: every selected name/versionHash pair must still match a fresh inspect
  legacyLoadFromDir: preview-only; callers must use /skills/import/apply to write
mcpAuthentication:
  shape:
    mode: none | credential_ref | oauth
    credentialRef: opaque string | null
  separation: authConfig and toolPolicy are independent persisted objects
  secretStorage: raw access tokens, refresh tokens, cookies, API keys, and OAuth payloads are forbidden
  responseRedaction: API responses expose envKeys but never env values or header values
  credentialRefValidation: >
    credential_ref must match the same approved secret-ref shape as
    provider_accounts.secretRef (env:, local-file:, external:, adapter:)
  currentExecution:
    stdioWithoutAuth: supported after explicit verification and enablement
    credentialRef: >
      supported for env: and local-file:los-auth/* after verify+enable;
      stdio injects resolved values into child env; remote injects
      Authorization Bearer headers in-memory; external:* and adapter:*
      remain fail-closed (backend_not_implemented); missing env or
      local-file secret fails closed at verify
    oauth: fail-closed until OAuth transport and credential resolution are implemented
    sse: supported after verify+enable when url present and auth resolved
    streamableHttp: supported after verify+enable when url present and auth resolved
mcpToolPolicy:
  shape:
    allow: string[]
    deny: string[]
    riskLevel: L0 | L1 | L2
  behavior:
    - deny takes precedence
    - a non-empty allow list excludes tools not named in it
    - accepted tools are registered with the configured risk level
mcpCapabilityAdapter:
  supportedKinds:
    - generic
    - cantool
  cantool:
    transport: stdio
    providerLocation: local
    providerId: cantool.mcp.local
    dataGrantOwner: cantool
    sessionBinding: per_call
    cancellation: notifications/cancelled with late results discarded
    resume: new_call_only
    initialAvailability:
      available:
        - runtime and plugin status through agent.resource.read
        - file index status
        - explicitly reviewed caller-supplied transforms, calculators, regex, and unit conversion
      blocked:
        - clipboard content and search
        - snippet content and search
        - file search, recent files, and file excerpts
        - capabilities missing read-only MCP annotations
        - capabilities not present in the reviewed adapter map
    disclosureEvidence:
      fields:
        - dataClassification
        - providerLocation
        - approvalMode
        - grantRequired
        - availability
        - reason
        - sessionBinding
        - cancellation
        - resume
      rule: >
        LOS may record and preflight opaque grant binding evidence, but CanTool
        remains the authorization owner. The current stdio bridge forwards no
        grant refs, so local-private capabilities remain blocked even when LOS
        receives apparently matching grant evidence.
registrationSafety:
  defaultEnabled: false
  executionEligibility:
    - enabled is true
    - status is connected
    - pinnedVersionHash is empty or equals versionHash
    - transport connection metadata is present (stdio command or remote url)
    - auth mode is none, or credential_ref with approved env:/local-file:los-auth/* shape
verification:
  - ./tools/check-contracts.sh
  - pnpm --filter @los/agent test
  - pnpm --filter @los/gateway test
  - pnpm --filter @los/web test
  - pnpm check
  - deterministic stdio MCP probe
  - pnpm run gate
