name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# CI is split into independent jobs so a hang in the DB-dependent test
# phase can no longer burn the whole gate budget, and a failing/hanging
# phase remains distinguishable from fast, Web E2E, and migration checks.
#
#   gate-fast  — typecheck/structure/coupling/state-machine/contracts/
#                delete-safety/unwired. No DB. Fast feedback.
#   gate-test  — one root `pnpm test` against PostgreSQL, followed by critical
#                coverage. The root runner already executes every workspace
#                package and reports the failing package through Turbo.
#   gate-drift — migration-drift gate (own DB env, isolated from NODE_ENV
#                redirect).
jobs:
  gate-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache turbo (fast)
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-fast-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-fast-${{ github.ref_name }}-
            turbo-${{ runner.os }}-fast-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Fast gate (no DB, no tests)
        run: pnpm run gate -- --no-tests

      - name: Report gate phase summary
        if: always()
        run: |
          if [ -f /tmp/los-gate-summary.json ]; then
            cat /tmp/los-gate-summary.json
            {
              echo '### gate-fast phase summary'
              echo
              echo '```json'
              cat /tmp/los-gate-summary.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no /tmp/los-gate-summary.json produced"
          fi

  gate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: los
          POSTGRES_PASSWORD: los
          POSTGRES_DB: los_test
          POSTGRES_HOST_AUTH_METHOD: md5
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    env:
      DATABASE_URL: postgres://los:los@localhost:5432/los_test
      TEST_DATABASE_URL: postgres://los:los@localhost:5432/los_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install jj for managed workspace tests
        env:
          JJ_VERSION: 0.39.0
          JJ_SHA256: 8da8d96e9c8696c21ad47847a63d533e249acb0449d9af0f0562b5ea7b024f04
        run: |
          archive="jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          echo "${JJ_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          sudo tar -xzf "/tmp/${archive}" -C /usr/local/bin ./jj
          jj --version

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache turbo (test)
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-test-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-test-${{ github.ref_name }}-
            turbo-${{ runner.os }}-test-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Diagnose the intermittent "test processes lost DATABASE_URL" class of
      # failures (2026-08-20 PR #256: pg SCRAM "client password must be a
      # string" across every DB-backed package because the test process fell
      # back to the built-in default DB). Printing presence + redacted URL
      # turns the next occurrence into a one-line diagnosis. See git history
      # (56321f52, 2026-06-13) for the original incident of the same class.
      - name: Dump test environment diagnostics
        run: |
          echo "node: $(node -v)"
          for v in DATABASE_URL TEST_DATABASE_URL CI NODE_ENV; do
            val="${!v:-}"
            if [ -n "$val" ]; then
              case "$v" in
                DATABASE_URL|TEST_DATABASE_URL)
                  redacted="$(printf '%s' "$val" | sed -E 's#//[^@/]*@#//***@#')"
                  db="$(printf '%s' "$val" | sed -E 's#^.*/([^/?]*)(\?.*)?$#\1#')"
                  echo "$v=set(url=${redacted}, db=${db})"
                  ;;
                *) echo "$v=$val" ;;
              esac
            else
              echo "$v=<unset>"
            fi
          done

      - name: Test root workspace
        env:
          RESOURCE_OBSERVATION_FILE: ${{ runner.temp }}/gate-test-resources.json
          TEST_LOG_FILE: ${{ runner.temp }}/gate-test.log
        run: |
          node tools/observe-command-resources.mjs \
            --label github-gate-test \
            --output "$RESOURCE_OBSERVATION_FILE" \
            -- bash -o pipefail -c 'set -o pipefail; pnpm test 2>&1 | tee "$TEST_LOG_FILE" | bash tools/check-known-failures.sh --allow-fixed'
        timeout-minutes: 12

      - name: Report test resource observation
        if: always()
        env:
          RESOURCE_OBSERVATION_FILE: ${{ runner.temp }}/gate-test-resources.json
        run: |
          if [ ! -f "$RESOURCE_OBSERVATION_FILE" ]; then
            echo "resource observation unavailable (test may have been cancelled before the observer flushed)"
            exit 0
          fi
          cat "$RESOURCE_OBSERVATION_FILE"
          {
            echo '### gate-test resource observation'
            echo
            echo '```json'
            cat "$RESOURCE_OBSERVATION_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce critical module coverage
        env:
          COVERAGE_LOG_FILE: ${{ runner.temp }}/critical-coverage.log
        run: |
          set -o pipefail
          pnpm test:coverage:critical 2>&1 | tee "$COVERAGE_LOG_FILE"
        timeout-minutes: 5

      - name: Collect bounded test failure evidence
        if: failure()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/ci-failure-evidence/gate-test
          RESOURCE_OBSERVATION_FILE: ${{ runner.temp }}/gate-test-resources.json
          TEST_LOG_FILE: ${{ runner.temp }}/gate-test.log
          COVERAGE_LOG_FILE: ${{ runner.temp }}/critical-coverage.log
        run: >-
          node tools/collect-ci-failure-evidence.mjs
          --output "$EVIDENCE_DIR"
          --max-bytes 10485760
          --tail-bytes 524288
          --file resources="$RESOURCE_OBSERVATION_FILE"
          --tail test-log="$TEST_LOG_FILE"
          --tail coverage-log="$COVERAGE_LOG_FILE"

      - name: Upload test failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-gate-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-failure-evidence/gate-test
          if-no-files-found: error
          retention-days: 5
          compression-level: 6

  gate-web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @los/web exec playwright install --with-deps chromium

      - name: Test Web operator paths
        env:
          WEB_E2E_LOG_FILE: ${{ runner.temp }}/web-e2e.log
        run: |
          set -o pipefail
          pnpm --filter @los/web test:e2e 2>&1 | tee "$WEB_E2E_LOG_FILE"

      - name: Collect bounded Web E2E failure evidence
        if: failure()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/ci-failure-evidence/gate-web-e2e
          WEB_E2E_LOG_FILE: ${{ runner.temp }}/web-e2e.log
        run: >-
          node tools/collect-ci-failure-evidence.mjs
          --output "$EVIDENCE_DIR"
          --max-bytes 10485760
          --tail-bytes 524288
          --tail web-e2e-log="$WEB_E2E_LOG_FILE"
          --tree playwright=packages/web/test-results

      - name: Upload Web E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-gate-web-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-failure-evidence/gate-web-e2e
          if-no-files-found: error
          retention-days: 5
          compression-level: 6

  gate-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: los
          POSTGRES_PASSWORD: los
          POSTGRES_DB: los_test
          POSTGRES_HOST_AUTH_METHOD: md5
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    # DATABASE_URL is the server URL check-migration-drift uses to CREATE
    # the ephemeral los_drift_mig / los_drift_ensure databases (los is
    # superuser on the postgres:16 service, so CREATEDB is allowed).
    env:
      DATABASE_URL: postgres://los:los@localhost:5432/los_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Migration-drift gate: bootstrap a fresh DB via migrations only and via
      # ensure*Store only, then diff. Fails on NEW drift vs the committed
      # baseline (tools/migration-drift-baseline.txt). Existing drift is
      # grandfathered until cleaned up. Runs only in CI (needs CREATEDB, which
      # the postgres:16 service user `los` has).
      # Unset NODE_ENV/TEST_DATABASE_URL: initDb's test guard would otherwise
      # ignore the gate's explicit drift-DB URLs and redirect to los_test,
      # making the gate compare a DB against itself (always green, inert).
      - name: Migration drift
        env:
          MIGRATION_DRIFT_LOG_FILE: ${{ runner.temp }}/migration-drift.log
          NODE_ENV: ''
          TEST_DATABASE_URL: ''
        run: |
          set -o pipefail
          pnpm check:migration-drift 2>&1 | tee "$MIGRATION_DRIFT_LOG_FILE"

      - name: Collect bounded migration failure evidence
        if: failure()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/ci-failure-evidence/gate-drift
          MIGRATION_DRIFT_LOG_FILE: ${{ runner.temp }}/migration-drift.log
        run: >-
          node tools/collect-ci-failure-evidence.mjs
          --output "$EVIDENCE_DIR"
          --max-bytes 10485760
          --tail-bytes 524288
          --tail migration-drift-log="$MIGRATION_DRIFT_LOG_FILE"

      - name: Upload migration failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-gate-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-failure-evidence/gate-drift
          if-no-files-found: error
          retention-days: 5
          compression-level: 6
