name: Docker Publish

# Publishes the los image to GHCR (ghcr.io/losecher/los) with both
# `latest` (rolling) and `sha-<commit>` (immutable) tags on linux/amd64
# and linux/arm64.
#
# Why this lives in GitHub Actions instead of Forgejo:
#   1. The only active Forgejo runner (win-los-canary) is Windows/podman and
#      cannot reliably produce linux/amd64+arm64 multi-platform images.
#      GitHub ubuntu-latest supports buildx + QEMU natively.
#   2. GHCR credentials are free here: GITHUB_TOKEN with packages:write.
#      Forgejo runner secrets are empty and would need a GHCR PAT.
#   3. The image identity is GitHub-native (ghcr.io/LosEcher/los; OCI source
#      already points at github.com/LosEcher/los).
#   4. Trigger chain is natural: Forgejo main → mirror PR → GitHub main push.
#
# Tag strategy (docker-bake.hcl):
#   TAG=<git-sha> docker buildx bake --push los-sha
#   → ghcr.io/losecher/los:latest
#   → ghcr.io/losecher/los:sha-<git-sha>

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-bake.hcl'
      - 'docker-compose.yml'
      - 'docker-entrypoint.sh'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: github-docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (latest + sha-<commit>)
        env:
          TAG: ${{ github.sha }}
        run: |
          docker buildx bake --push los-sha
